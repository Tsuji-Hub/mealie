name: Build Containers

# FORK NOTES (Tsuji-Hub/mealie)
# Upstream builds via Depot.dev (paid; project srzjb6mhzm) and pushes to Docker Hub
# (hkotel/mealie). A fork has neither, so this is rewritten to:
#   - build with stock docker/build-push-action + buildx (no Depot token needed)
#   - push ONLY to ghcr.io/tsuji-hub/mealie (Docker Hub removed - not our namespace)
#   - build linux/amd64 only (CT 100 is x86; arm64 doubled build time for nothing)
# DOCKERHUB_* secrets stay DECLARED but unused, so existing callers
# (nightly.yml / release.yml / pull-requests.yml) don't fail on an undefined secret.
#
# GOTCHA: github.repository is "Tsuji-Hub/mealie" (capitals). GHCR rejects uppercase
# image names, so the repo name is lowercased explicitly below.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      tags:
        required: false
        type: string
      ref:
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Lowercase the repository name (GHCR requires it)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.name }}
          # Overwrite the image.version label with our tag
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ inputs.tag }}
            ${{ inputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
