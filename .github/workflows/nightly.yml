name: Docker Nightly Production

# FORK NOTES (Tsuji-Hub/mealie)
# Upstream hard-gates the publish job with `if: github.repository == 'mealie-recipes/mealie'`,
# which means on a fork it is SKIPPED - the run goes green and no image is ever built.
# That gate is repointed at this fork below. Discord notify is removed (it used
# upstream's DISCORD_NIGHTLY_WEBHOOK secret, which we don't have).
#
# Result: any push to mealie-next builds and pushes ghcr.io/tsuji-hub/mealie:nightly.

on:
  push:
    branches:
      - mealie-next
    paths-ignore:
      - '*.md'
      - '.devcontainer/**'
      # I'm not excluding .github as changes in there might be to workflows etc
      - '.vscode/**'
      - 'docs/**'
  # lets us kick a build by hand from the Actions tab without an empty commit
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: "Backend Server Tests"
    uses: ./.github/workflows/test-backend.yml

  frontend-tests:
    name: "Frontend Tests"
    uses: ./.github/workflows/test-frontend.yml

  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: nightly

  publish:
    permissions:
      contents: read
      packages: write
    name: Build Tagged Release
    # FORK: was 'mealie-recipes/mealie' - on a fork that silently skipped the build.
    if: github.repository == 'Tsuji-Hub/mealie'
    uses: ./.github/workflows/publish.yml
    needs:
      - frontend-tests
      - backend-tests
      - build-package
    with:
      tag: nightly
